name: library-system

services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: library_system_db
      TZ: Asia/Shanghai
    ports:
      # 宿主机用 13306，避免与本机已安装的 MySQL（3306）冲突；
      # 容器内仍是标准 3306，后端通过服务名 mysql:3306 访问
      - "13306:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: library-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # 生产环境务必替换为随机长字符串（>=32 字符）
      JWT_SECRET: ${JWT_SECRET:-library-system-jwt-secret-key-2026-please-change-in-production-0123456789}
      # 允许跨域的前端地址；容器部署下前端由 Nginx 同源代理，通常无需跨域
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      # 容器内关闭 SQL 打印，减少日志噪音
      MYBATIS_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # 用 actuator 健康端点判断「真的能服务」，而不是「进程起来了」
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: library-frontend
    ports:
      # 如本机 80 被占用（IIS / 其他服务），改成 "8081:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mysql-data:
